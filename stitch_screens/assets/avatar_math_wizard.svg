<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWiz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a044e"/>
      <stop offset="50%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="hoodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="runeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="wizGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle with neon border -->
  <circle cx="100" cy="100" r="95" fill="url(#bgWiz)"/>
  <circle cx="100" cy="100" r="94" fill="none" stroke="#ec4899" stroke-width="3" stroke-dasharray="12 4" opacity="0.7"/>

  <!-- Mystic Robe Shoulders -->
  <path d="M 35 190 C 35 140, 70 130, 100 130 C 130 130, 165 140, 165 190 Z" fill="url(#hoodGrad)"/>
  
  <!-- Glowing Infinity Talisman on Chest -->
  <path d="M 85 165 C 75 155, 75 175, 85 175 C 95 175, 105 155, 115 155 C 125 155, 125 175, 115 175 C 105 175, 95 155, 85 165 Z" 
        fill="none" stroke="#fbbf24" stroke-width="4" filter="url(#wizGlow)"/>

  <!-- Mysterious Cyber Hood Shape -->
  <path d="M 45 130 C 40 70, 60 30, 100 24 C 140 30, 160 70, 155 130 C 140 145, 125 135, 100 138 C 75 135, 60 145, 45 130 Z" fill="url(#hoodGrad)"/>

  <!-- Hood Interior Shadow -->
  <path d="M 58 120 C 54 80, 70 50, 100 46 C 130 50, 146 80, 142 120 C 130 130, 118 122, 100 124 C 82 122, 70 130, 58 120 Z" fill="#180d2b"/>

  <!-- Glowing Neon Cyber Eyes / Visor under hood -->
  <!-- Left Eye -->
  <ellipse cx="80" cy="92" rx="10" ry="5" fill="#f43f5e" filter="url(#wizGlow)"/>
  <ellipse cx="80" cy="92" rx="4" ry="2" fill="#ffffff"/>
  <!-- Right Eye -->
  <ellipse cx="120" cy="92" rx="10" ry="5" fill="#f43f5e" filter="url(#wizGlow)"/>
  <ellipse cx="120" cy="92" rx="4" ry="2" fill="#ffffff"/>

  <!-- Mystic Math Runes Floating Around -->
  <text x="42" y="70" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" fill="#ec4899" filter="url(#wizGlow)">∑</text>
  <text x="150" y="75" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" fill="#f43f5e" filter="url(#wizGlow)">∞</text>
  <text x="100" y="38" font-family="'Outfit', sans-serif" font-weight="900" font-size="14" fill="#fbbf24" text-anchor="middle" filter="url(#wizGlow)">√x</text>

  <!-- Beard / Mysterious Mask Trim -->
  <polygon points="100,126 92,108 108,108" fill="#a855f7" opacity="0.6"/>
</svg>
