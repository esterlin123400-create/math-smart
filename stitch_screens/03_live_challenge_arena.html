<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حلبة التحديات المباشرة - أذكياء الرياضيات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-arena: #050811;
            --surface-box: rgba(18, 24, 43, 0.85);
            --border-neon: rgba(236, 72, 153, 0.4);
            --neon-pink: #ec4899;
            --neon-blue: #38bdf8;
            --neon-amber: #f59e0b;
            --text-heading: #ffffff;
            --text-body: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-arena);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(236, 72, 153, 0.2) 0%, transparent 45%),
                radial-gradient(circle at 90% 20%, rgba(56, 189, 248, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 50% 90%, rgba(79, 70, 229, 0.2) 0%, transparent 50%);
            min-height: 100vh;
            color: var(--text-body);
            padding: 25px 30px;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            padding: 16px 25px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .arena-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .arena-badge {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 13px;
            color: #fff;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 10px rgba(236, 72, 153, 0.4); }
            to { box-shadow: 0 0 25px rgba(236, 72, 153, 0.8); }
        }

        .live-tag {
            background: #ef4444;
            color: #fff;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 8px; height: 8px;
            background: #fff;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* BATTLE ARENA VS */
        .battle-stage {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 25px;
            align-items: center;
            margin-bottom: 30px;
        }

        .player-card {
            background: var(--surface-box);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s;
        }

        .player-1 { border-color: rgba(56, 189, 248, 0.5); box-shadow: 0 10px 30px rgba(56, 189, 248, 0.15); }
        .player-2 { border-color: rgba(236, 72, 153, 0.5); box-shadow: 0 10px 30px rgba(236, 72, 153, 0.15); flex-direction: row-reverse; }

        .player-avatar {
            width: 80px; height: 80px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.15);
            transition: transform 0.3s ease;
        }
        .player-avatar:hover { transform: scale(1.08) rotate(-2deg); }
        .player-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .avatar-1 { background: linear-gradient(135deg, #0284c7, #38bdf8); }
        .avatar-2 { background: linear-gradient(135deg, #be185d, #ec4899); }

        .player-info { flex-grow: 1; }
        .player-2 .player-info { text-align: left; }

        .player-name {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
        }

        .player-rank { font-size: 12px; color: var(--neon-amber); font-weight: 700; margin-bottom: 10px; }

        .health-bar {
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .health-fill-1 { height: 100%; width: 85%; background: linear-gradient(90deg, #38bdf8, #818cf8); border-radius: 10px; }
        .health-fill-2 { height: 100%; width: 70%; background: linear-gradient(90deg, #f43f5e, #ec4899); border-radius: 10px; }

        .vs-circle {
            width: 70px; height: 70px;
            background: #0f172a;
            border: 2px solid var(--neon-amber);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: #fbbf24;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.5);
        }

        /* QUESTION BOX */
        .challenge-box {
            background: var(--surface-box);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            text-align: center;
        }

        .timer-circle {
            width: 60px; height: 60px;
            border-radius: 50%;
            border: 3px solid #10b981;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', monospace;
            font-size: 20px;
            font-weight: 800;
            color: #34d399;
        }

        .challenge-title {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 15px;
        }

        .challenge-equation {
            font-size: 32px;
            font-family: 'Outfit', serif;
            color: #38bdf8;
            margin-bottom: 30px;
            direction: ltr;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .opt-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 18px;
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
        }

        .opt-btn:hover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
            transform: scale(1.02);
        }

        .opt-btn.correct {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.25);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
        }
    </style>
</head>
<body>
    <header>
        <div class="arena-brand">
            <span class="arena-badge">⚔️ حلبة التحديات الحية</span>
            <span style="font-size:14px; color:var(--text-body); font-weight:700">جولة نهائي أبطال الرياضيات</span>
        </div>
        <div style="display:flex; align-items:center; gap:15px">
            <div class="live-tag"><span class="live-dot"></span> بث مباشر</div>
            <a href="index.html" style="color:#94a3b8; font-size:13px; text-decoration:none">← خروج</a>
        </div>
    </header>

    <div class="battle-stage">
        <!-- PLAYER 1 -->
        <div class="player-card player-1">
            <div class="player-avatar avatar-1">
                <img src="assets/avatar_fahad_hero.svg" alt="فهد البطل - رائد أذكياء الرياضيات">
            </div>
            <div class="player-info">
                <div class="player-name">فهد البطل (أنت)</div>
                <div class="player-rank">الدرجة: عبقري ذهبي ★★★</div>
                <div class="health-bar"><div class="health-fill-1"></div></div>
                <div style="font-size:12px; color:#38bdf8; font-weight:700">النقاط: 850 XP</div>
            </div>
        </div>

        <div class="vs-circle">VS</div>

        <!-- PLAYER 2 -->
        <div class="player-card player-2">
            <div class="player-avatar avatar-2">
                <img src="assets/avatar_math_wizard.svg" alt="ساحر الأرقام - المنافس الأسطوري">
            </div>
            <div class="player-info">
                <div class="player-name">المنافس: ساحر الأرقام</div>
                <div class="player-rank">الدرجة: عبقري متقدم ★★</div>
                <div class="health-bar"><div class="health-fill-2"></div></div>
                <div style="font-size:12px; color:#ec4899; font-weight:700">النقاط: 700 XP</div>
            </div>
        </div>
    </div>

    <!-- CHALLENGE BOX -->
    <div class="challenge-box">
        <div class="timer-circle" id="timer">14s</div>
        <div class="challenge-title">السؤال الحاسم (الجولة 4 من 5):</div>
        <div class="challenge-equation">7² - 4 × 6 = ?</div>

        <div class="options-grid">
            <button class="opt-btn" onclick="selectAnswer(this, false)">19</button>
            <button class="opt-btn" onclick="selectAnswer(this, true)">25</button>
            <button class="opt-btn" onclick="selectAnswer(this, false)">31</button>
            <button class="opt-btn" onclick="selectAnswer(this, false)">27</button>
        </div>
    </div>

    <script>
        function selectAnswer(btn, isCorrect) {
            if (isCorrect) {
                btn.classList.add('correct');
                btn.innerText += " ✓ (صحيح!)";
                alert('🎉 إجابة خارقة السرعة وصحيحة! تفوقت على المنافس.');
            } else {
                btn.style.borderColor = '#ef4444';
                btn.style.background = 'rgba(239, 68, 68, 0.2)';
                alert('❌ إجابة خاطئة! 7² = 49، ثم 4 × 6 = 24، والناتج 49 - 24 = 25');
            }
        }
    </script>
</body>
</html>
