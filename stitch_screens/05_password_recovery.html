<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور - أذكياء الرياضيات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #080d1a;
            --surface: rgba(17, 24, 39, 0.75);
            --border: rgba(255, 255, 255, 0.1);
            --primary: #4f46e5;
            --accent-cyan: #06b6d4;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 20px;
            color: #fff;
            background-image: radial-gradient(circle at 50% 20%, rgba(79, 70, 229, 0.25) 0%, transparent 50%);
        }
        .card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 100%;
            max-width: 460px;
            padding: 40px 35px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            text-align: center;
        }
        .icon {
            width: 68px; height: 68px;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
        p { color: var(--text-muted); font-size: 14px; margin-bottom: 25px; line-height: 1.6; }
        .input-group { text-align: right; margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
        input {
            width: 100%;
            padding: 14px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
        }
        input:focus { outline: none; border-color: #6366f1; }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
        }
        .btn:hover { filter: brightness(1.1); }
        .links { margin-top: 25px; font-size: 13px; }
        .links a { color: #38bdf8; text-decoration: none; font-weight: 700; margin: 0 8px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔑</div>
        <h1>استعادة كلمة المرور</h1>
        <p>أدخل بريدك الإلكتروني أو كود الطالب المسجل وسنرسل لك رمز التحقق السريع (OTP)</p>

        <form onsubmit="event.preventDefault(); alert('تم إرسال رمز استعادة كلمة المرور بنجاح!'); window.location.href='04_student_login.html';">
            <div class="input-group">
                <label>البريد الإلكتروني أو كود الطالب:</label>
                <input type="text" placeholder="student@math.edu.sa أو كود الطالب" required>
            </div>
            <button type="submit" class="btn">إرسال رمز التحقق ✉️</button>
        </form>

        <div class="links">
            <a href="04_student_login.html">← العودة لتسجيل الدخول</a>
            •
            <a href="index.html">معرض الواجهات</a>
        </div>
    </div>
</body>
</html>
