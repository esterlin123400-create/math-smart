<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="100%">
  <defs>
    <linearGradient id="scaleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cubeXGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="goldWeight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="diagramGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Grid Background -->
  <rect x="0" y="0" width="540" height="220" rx="16" fill="#030712" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="0" y1="55" x2="540" y2="55" stroke="#1e293b" stroke-width="0.75" stroke-dasharray="4 4"/>
  <line x1="0" y1="110" x2="540" y2="110" stroke="#1e293b" stroke-width="0.75" stroke-dasharray="4 4"/>
  <line x1="0" y1="165" x2="540" y2="165" stroke="#1e293b" stroke-width="0.75" stroke-dasharray="4 4"/>
  <line x1="135" y1="0" x2="135" y2="220" stroke="#1e293b" stroke-width="0.75" stroke-dasharray="4 4"/>
  <line x1="270" y1="0" x2="270" y2="220" stroke="#1e293b" stroke-width="0.75" stroke-dasharray="4 4"/>
  <line x1="405" y1="0" x2="405" y2="220" stroke="#1e293b" stroke-width="0.75" stroke-dasharray="4 4"/>

  <!-- Diagram Title / Legend -->
  <rect x="15" y="12" width="130" height="24" rx="6" fill="rgba(56, 189, 248, 0.1)"/>
  <text x="80" y="28" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">ميزان تكافؤ المعادلة ⚖️</text>

  <!-- Scale Base -->
  <polygon points="270,110 240,195 300,195" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="220" y="195" width="100" height="12" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <!-- Center Pivot Indicator (= Equilibrium) -->
  <circle cx="270" cy="110" r="18" fill="#0f172a" stroke="#10b981" stroke-width="3" filter="url(#diagramGlow)"/>
  <text x="270" y="117" font-family="'Outfit', sans-serif" font-size="20" font-weight="900" fill="#10b981" text-anchor="middle">=</text>

  <!-- Horizontal Balance Beam -->
  <line x1="100" y1="110" x2="440" y2="110" stroke="url(#scaleGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- LEFT PAN (3x + 12) -->
  <line x1="120" y1="110" x2="90" y2="155" stroke="#64748b" stroke-width="1.5"/>
  <line x1="180" y1="110" x2="210" y2="155" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 80 155 Q 150 172 220 155 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>

  <!-- 3x Cubes on Left Pan -->
  <g transform="translate(98, 118)">
    <rect x="0" y="0" width="28" height="28" rx="6" fill="url(#cubeXGrad)" stroke="#a5b4fc" stroke-width="1"/>
    <text x="14" y="19" font-family="'Outfit'" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">x</text>
  </g>
  <g transform="translate(132, 118)">
    <rect x="0" y="0" width="28" height="28" rx="6" fill="url(#cubeXGrad)" stroke="#a5b4fc" stroke-width="1"/>
    <text x="14" y="19" font-family="'Outfit'" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">x</text>
  </g>
  <g transform="translate(166, 118)">
    <rect x="0" y="0" width="28" height="28" rx="6" fill="url(#cubeXGrad)" stroke="#a5b4fc" stroke-width="1"/>
    <text x="14" y="19" font-family="'Outfit'" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">x</text>
  </g>
  <!-- +12 Constant badge -->
  <g transform="translate(118, 90)">
    <rect x="0" y="0" width="58" height="22" rx="11" fill="url(#goldWeight)"/>
    <text x="29" y="16" font-family="'Outfit'" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">+ 12</text>
  </g>
  <text x="150" y="195" font-family="'Outfit'" font-size="14" font-weight="800" fill="#38bdf8" text-anchor="middle">الطرف الأيسر: 3x + 12</text>

  <!-- RIGHT PAN (36) -->
  <line x1="360" y1="110" x2="330" y2="155" stroke="#64748b" stroke-width="1.5"/>
  <line x1="420" y1="110" x2="450" y2="155" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 320 155 Q 390 172 460 155 Z" fill="#1e293b" stroke="#10b981" stroke-width="2"/>

  <!-- Large 36 Block on Right Pan -->
  <g transform="translate(355, 96)">
    <rect x="0" y="0" width="70" height="50" rx="10" fill="linear-gradient(135deg, #10b981, #059669)" stroke="#6ee7b7" stroke-width="2" filter="url(#diagramGlow)"/>
    <text x="35" y="33" font-family="'Outfit'" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">36</text>
  </g>
  <text x="390" y="195" font-family="'Outfit'" font-size="14" font-weight="800" fill="#34d399" text-anchor="middle">الطرف الأيمن: 36</text>
</svg>
