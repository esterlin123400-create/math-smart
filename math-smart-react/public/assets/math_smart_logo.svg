<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Neon Glow Indigo to Cyan -->
    <linearGradient id="neonCyanIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Pink to Violet Glow -->
    <linearGradient id="pinkPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="60%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Golden Ratio Spiral Gradient -->
    <linearGradient id="spiralGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Filter for Glow Effect -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feComposite in="SourceGraphic" in2="blur2" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="8" y="8" width="184" height="184" rx="44" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Ambient Light Behind Emblem -->
  <circle cx="100" cy="100" r="60" fill="#4f46e5" opacity="0.25" filter="url(#softGlow)" />
  <circle cx="125" cy="75" r="30" fill="#06b6d4" opacity="0.3" filter="url(#softGlow)" />

  <!-- Geometric Hexagonal Math Shield -->
  <polygon points="100,28 156,58 156,122 100,154 44,122 44,58" fill="rgba(15, 23, 42, 0.6)" stroke="url(#neonCyanIndigo)" stroke-width="2.5" stroke-linejoin="round" />
  <polygon points="100,36 148,62 148,118 100,146 52,118 52,62" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- Crystalline Isometric 3D Cube / Prism -->
  <!-- Top Face -->
  <polygon points="100,60 126,75 100,90 74,75" fill="#38bdf8" opacity="0.3" stroke="#67e8f9" stroke-width="1.5" />
  <!-- Left Face -->
  <polygon points="74,75 100,90 100,122 74,107" fill="#4f46e5" opacity="0.4" stroke="#818cf8" stroke-width="1.5" />
  <!-- Right Face -->
  <polygon points="100,90 126,75 126,107 100,122" fill="#8b5cf6" opacity="0.4" stroke="#c084fc" stroke-width="1.5" />

  <!-- Golden Ratio Fibonacci Math Spiral -->
  <path d="M 100 100 
           A 6 6 0 0 1 94 94 
           A 12 12 0 0 1 106 82 
           A 22 22 0 0 1 128 104 
           A 38 38 0 0 1 90 142 
           A 62 62 0 0 1 38 80 
           A 88 88 0 0 1 126 12" 
        fill="none" 
        stroke="url(#spiralGold)" 
        stroke-width="3" 
        stroke-linecap="round" 
        filter="url(#glowEffect)" />

  <!-- Golden Spiral Grid Squares -->
  <rect x="94" y="94" width="6" height="6" fill="none" stroke="#67e8f9" stroke-width="0.8" opacity="0.7" />
  <rect x="94" y="88" width="12" height="12" fill="none" stroke="#67e8f9" stroke-width="0.8" opacity="0.7" />
  <rect x="82" y="88" width="24" height="24" fill="none" stroke="#818cf8" stroke-width="0.8" opacity="0.6" />
  <rect x="82" y="112" width="38" height="38" fill="none" stroke="#c084fc" stroke-width="0.8" opacity="0.5" />

  <!-- Radiant Star of Genius (Compass Star) -->
  <g transform="translate(132, 64)" filter="url(#glowEffect)">
    <!-- 8-Point Compass Star -->
    <path d="M 0 -22 L 4 -6 L 20 0 L 4 6 L 0 22 L -4 6 L -20 0 L -4 -6 Z" fill="url(#pinkPurple)" />
    <!-- Diagonal smaller spikes -->
    <path d="M 0 -14 L 3 -4 L 13 0 L 3 4 L 0 14 L -3 4 L -13 0 L -3 -4 Z" transform="rotate(45)" fill="#ffffff" opacity="0.85" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>

  <!-- Math Sparkles & Constellation Nodes -->
  <circle cx="68" cy="52" r="2.5" fill="#38bdf8" filter="url(#glowEffect)" />
  <circle cx="145" cy="118" r="2" fill="#ec4899" filter="url(#glowEffect)" />
  <circle cx="58" cy="120" r="1.8" fill="#fbbf24" filter="url(#glowEffect)" />
  <circle cx="100" cy="154" r="2.2" fill="#67e8f9" filter="url(#glowEffect)" />

  <!-- Subtle Math Infinity / Integral Symbol in Corner -->
  <path d="M 86 172 C 86 168, 92 168, 95 171 C 98 174, 104 174, 104 170" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
</svg>
