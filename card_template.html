<div class="card" data-category="{{CATEGORY}}" data-title="{{TITLE}}" data-id="{{ID}}">
    <div class="card-preview">
        <span class="batch-badge">واجهة {{INDEX}}</span>
        {{IMG_TAG}}
    </div>
    <div class="card-body">
        <div>
            <div class="card-category">{{CATEGORY}}</div>
            <div class="card-title">{{TITLE}}</div>
            <div class="card-id-row">
                <span>ID: {{ID}}</span>
                <button class="copy-id-btn" onclick="copyToClipboard('{{ID}}')" title="نسخ المعرف">نسخ ID</button>
            </div>
        </div>
        <div class="card-actions">
            {{HTML_BTN}}
            {{PNG_BTN}}
        </div>
    </div>
</div>
